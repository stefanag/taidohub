# Build images and deploy to Hetzner.
#
# staging     automatically after CI passes on main
# production  manually (Actions › Deploy › Run workflow), gated by the
#             `production` environment's required reviewers
#
# Repository › Settings › Environments: create `staging` and `production`,
# each with these secrets:
#   DEPLOY_HOST          server IPv4
#   DEPLOY_SSH_KEY       private key for the deploy user (a dedicated key)
#   DEPLOY_KNOWN_HOSTS   output of: ssh-keyscan -t ed25519 <server-ip>
# and this variable:
#   SITE_URL             https://staging.taidohub.se or https://taidohub.se
# Then set the repository variable DEPLOY_ENABLED=true (Settings › Variables).
# STAGING_AUTO_DEPLOY=false turns off the automatic staging deploy after CI
# (manual runs still work), e.g. while there is no staging server; see
# deploy/hetzner/PROMOTE-STAGING-TO-PRODUCTION.md.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    # No-op until the repository variable DEPLOY_ENABLED is 'true', so merging
    # this before the servers exist does not produce failing runs. (Environment
    # variables such as SITE_URL are not available in a job-level `if`.)
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && vars.STAGING_AUTO_DEPLOY != 'false'))
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      ENV_NAME: ${{ github.event.inputs.environment || 'staging' }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Image tag
        run: echo "TAG=${ENV_NAME}-${SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/hetzner/Dockerfile
          target: app
          push: true
          tags: ghcr.io/${{ env.OWNER }}/taidohub-app:${{ env.TAG }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/hetzner/Dockerfile
          target: web
          build-args: VITE_API_URL=${{ vars.SITE_URL }}
          push: true
          tags: ghcr.io/${{ env.OWNER }}/taidohub-web:${{ env.TAG }}
          cache-from: type=gha,scope=web-${{ env.ENV_NAME }}
          cache-to: type=gha,scope=web-${{ env.ENV_NAME }},mode=max

      - name: SSH setup
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # Secrets pasted or piped on Windows can carry CRLF line endings,
          # which OpenSSH rejects ("error in libcrypto"); strip them.
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null; then
            echo "::error::DEPLOY_SSH_KEY is not a valid private key. Set it from the key file, not by pasting."
            exit 1
          fi
          echo "Deploy key fingerprint: $(ssh-keygen -lf ~/.ssh/id_ed25519 | cut -d' ' -f2)"

      - name: Copy deploy files and deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          scp deploy/hetzner/{compose.yaml,deploy.sh,backup.sh,restore.sh,seed.sh} "deploy@${HOST}:/opt/taidohub/"
          ssh "deploy@${HOST}" "chmod +x /opt/taidohub/*.sh && /opt/taidohub/deploy.sh ${TAG}"

      - name: Smoke test
        # Caddy obtains the TLS certificate on first start, which can take a
        # minute or two; allow about three minutes before failing.
        run: curl -fsS --retry 36 --retry-delay 5 --retry-all-errors "${{ vars.SITE_URL }}/api/health"
