# Disposable Postgres for backend e2e tests.
#
# Usage (from repo root):
#   pnpm --filter backend test:e2e:up      # start
#   pnpm --filter backend test:e2e:migrate # apply schema
#   pnpm --filter backend test:e2e         # run vitest e2e suite
#   pnpm --filter backend test:e2e:down    # stop + remove volume
#
# Or the all-in-one:
#   pnpm --filter backend test:e2e:all
#
# Port 5433 is used so this container doesn't clash with a locally-installed
# Postgres on 5432. If you already have something on 5433, override with:
#   E2E_POSTGRES_PORT=15432 pnpm --filter backend test:e2e:up
services:
  postgres:
    image: postgres:16-alpine
    container_name: taidohub-e2e-postgres
    environment:
      POSTGRES_USER: taidohub
      POSTGRES_PASSWORD: taidohub
      POSTGRES_DB: taidohub_e2e
    ports:
      - "${E2E_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taidohub -d taidohub_e2e"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      # Speeds up test runs and guarantees data is thrown away on `down`.
      - /var/lib/postgresql/data
