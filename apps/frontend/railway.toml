# Railway service config for the Vite SPA.
#
# In the Railway dashboard, point this service at the repo root
# (Root Directory = `/`) and set Config-File Path to
# `apps/frontend/railway.toml`. Building from the repo root is required so
# pnpm can resolve the `@repo/contracts` workspace dependency.

[build]
# Use turbo so the upstream `@repo/contracts#build` (tsup) runs first —
# the frontend's `@repo/contracts/*` subpath imports resolve to dist/*.d.ts
# files that don't exist until that build completes. `pnpm --filter frontend
# build` alone skips the dep build and the frontend's `tsc --noEmit` then
# fails to find the contracts modules. The chained `tsc && vite build` in
# the frontend's own `build` script still runs, so a type regression still
# fails the deploy before any bundle is produced.
buildCommand = "pnpm install --frozen-lockfile && pnpm turbo run build --filter=frontend"
watchPatterns = [
  "apps/frontend/**",
  "packages/contracts/**",
  "package.json",
  "pnpm-lock.yaml",
  "turbo.json",
]

[deploy]
# `pnpm dlx serve` fetches `serve` on demand — no extra package.json entry
# required. `--single` falls SPA routes back to index.html so TanStack Router
# can take over client-side.
startCommand = "pnpm dlx serve -s apps/frontend/dist -l $PORT --single"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
