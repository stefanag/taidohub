# Railway service config for the Vite SPA.
#
# In the Railway dashboard, point this service at the repo root
# (Root Directory = `/`) and set Config-File Path to
# `apps/frontend/railway.toml`. Building from the repo root is required so
# pnpm can resolve the `@repo/contracts` workspace dependency.

[build]
builder = "NIXPACKS"
# `pnpm --filter frontend build` chains `tsc --noEmit && vite build`, so
# a type regression fails the deploy before any bundle is produced.
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter frontend build"
watchPatterns = [
  "apps/frontend/**",
  "packages/contracts/**",
  "package.json",
  "pnpm-lock.yaml",
  "turbo.json",
]

[deploy]
# `pnpm dlx serve` fetches `serve` on demand — no extra package.json entry
# required. `--single` falls SPA routes back to index.html so TanStack Router
# can take over client-side.
startCommand = "pnpm dlx serve -s apps/frontend/dist -l $PORT --single"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
