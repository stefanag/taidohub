info:
  title: taidohub API
  description: HTTP boundary for taidohub — schemas derived from
    `@repo/contracts`, enforced at runtime by `ZodValidationPipe` and documented
    here.
  version: 0.0.0
  contact: {}
tags:
  - name: auth
    description: ""
  - name: users
    description: ""
  - name: organisations
    description: ""
  - name: audit-log
    description: ""
  - name: health
    description: ""
servers:
  - url: http://localhost:3001
    description: Local
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: better-auth.session_token
    bearer:
      scheme: bearer
      bearerFormat: session-token
      type: http
  schemas:
    SignInWithEmailDto:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
          description: Registered email address.
          x-nestjs_zod-parent-metadata:
            description: Payload for `POST /api/auth/sign-in/email`.
            example: &a10
              email: ada@example.com
              password: correct-horse-battery-staple
        password:
          type: string
          minLength: 8
          description: Account password (8+ chars).
          x-nestjs_zod-parent-metadata:
            description: Payload for `POST /api/auth/sign-in/email`.
            example: *a10
      required:
        - email
        - password
    SessionDto:
      type: object
      properties:
        user:
          $ref: "#/$defs/User"
          type: ""
          x-nestjs_zod-parent-has-refs: true
          x-nestjs_zod-empty-type: true
          x-nestjs_zod-$defs: &a11
            User:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  description: Unique identifier (UUID v4).
                email:
                  type: string
                  format: email
                  pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                  description: The user’s primary email address.
                name:
                  anyOf:
                    - type: string
                    - type: "null"
                  description: Display name; null until the user sets one.
                emailVerified:
                  type: boolean
                  description: Whether the email address has been verified.
                image:
                  anyOf:
                    - type: string
                      format: uri
                    - type: "null"
                  description: URL to the user’s avatar, if any.
                role:
                  description: Global role; org-scoped roles live in `organisation_membership`.
                  $ref: "#/$defs/Role"
                deactivatedAt:
                  anyOf:
                    - type: string
                      format: date-time
