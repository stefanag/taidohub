            type: string
        - name: page
          required: false
          in: query
          x-nestjs_zod-parent-has-refs: true
          x-nestjs_zod-$defs: *a9
          schema:
            maximum: 9007199254740991
            exclusiveMinimum: 0
            default: 1
            type: integer
        - name: perPage
