              - "false"
              - all
        - name: page
          required: false
          in: query
          x-nestjs_zod-parent-has-refs: true
          x-nestjs_zod-$defs: *a10
          schema:
            minimum: 1
            maximum: 9007199254740991
            default: 1
            type: integer
        - name: perPage
