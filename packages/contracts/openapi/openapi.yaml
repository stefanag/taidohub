          in: query
          x-nestjs_zod-parent-has-refs: true
          x-nestjs_zod-empty-type: true
          x-nestjs_zod-$defs: *a10
          schema:
            $ref: "#/$defs/Role"
        - name: deactivated
          required: false
          in: query
          x-nestjs_zod-parent-has-refs: true
          x-nestjs_zod-$defs: *a10
          schema:
            default: "false"
            type: string
            enum:
