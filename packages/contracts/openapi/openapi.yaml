      summary: Set a password from a one-time invite or reset token.
      tags: *a2
  /api/account/accept-with-google:
    post:
      description: "Consumes the token, marks the email verified and, for invitations,
        records the accepted texts. Sets no password and starts no session: the
        client then signs in with Google, which links the Google account with
        the same verified address."
      operationId: AccountController_acceptWithGoogle
