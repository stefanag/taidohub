          x-nestjs_zod-has-null: true
          x-nestjs_zod-parent-metadata:
            description: A user account exposed to API clients.
            example: *a11
        image:
          anyOf:
            - type: string
              format: uri
            - type: "null"
          description: URL to the user’s avatar, if any.
          x-nestjs_zod-has-null: true
          x-nestjs_zod-empty-type: true
          x-nestjs_zod-parent-metadata:
            description: A user account exposed to API clients.
            example: *a11
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          description: ISO-8601 timestamp the account was created.
          x-nestjs_zod-has-null: true
          x-nestjs_zod-parent-metadata:
            description: A user account exposed to API clients.
            example: *a11
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          description: ISO-8601 timestamp the account was last modified.
