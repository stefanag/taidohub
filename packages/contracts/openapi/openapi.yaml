info:
  title: taidohub API
  description: HTTP boundary for taidohub — schemas derived from
    `@repo/contracts`, enforced at runtime by `ZodValidationPipe` and documented
    here.
  version: 0.0.0
  contact: {}
tags:
  - name: auth
    description: ""
  - name: users
    description: ""
  - name: organisations
    description: ""
  - name: health
    description: ""
servers:
  - url: http://localhost:3001
    description: Local
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: better-auth.session_token
    bearer:
      scheme: bearer
      bearerFormat: session-token
      type: http
  schemas:
    SignInWithEmailDto:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
          description: Registered email address.
          x-nestjs_zod-parent-metadata:
            description: Payload for `POST /api/auth/sign-in/email`.
            example: &a7
              email: ada@example.com
              password: correct-horse-battery-staple
        password:
          type: string
          minLength: 8
          description: Account password (8+ chars).
          x-nestjs_zod-parent-metadata:
            description: Payload for `POST /api/auth/sign-in/email`.
            example: *a7
      required:
        - email
        - password
    SessionDto:
      type: object
      properties:
        user:
          $ref: "#/$defs/User"
          type: ""
          x-nestjs_zod-parent-has-refs: true
          x-nestjs_zod-empty-type: true
          x-nestjs_zod-$defs: &a8
            User:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  description: Unique identifier (UUID v4).
                email:
                  type: string
                  format: email
                  pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                  description: The user’s primary email address.
                name:
                  anyOf:
                    - type: string
                    - type: "null"
                  description: Display name; null until the user sets one.
                emailVerified:
                  type: boolean
                  description: Whether the email address has been verified.
                image:
                  anyOf:
                    - type: string
                      format: uri
                    - type: "null"
                  description: URL to the user’s avatar, if any.
                createdAt:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                  description: ISO-8601 timestamp the account was created.
                updatedAt:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                  description: ISO-8601 timestamp the account was last modified.
              required:
                - id
                - email
                - name
                - emailVerified
                - image
                - createdAt
                - updatedAt
              description: A user account exposed to API clients.
              example:
                id: 4a3a2e0e-2e8c-4b7a-9a6e-1f9d1e54b8f5
                email: ada@example.com
                name: Ada Lovelace
                emailVerified: true
                image: https://example.com/avatars/ada.png
                createdAt: 2025-01-15T12:34:56.000Z
                updatedAt: 2025-04-02T08:00:00.000Z
          x-nestjs_zod-parent-metadata:
            description: The session payload returned by `GET /api/auth/get-session` for an
              authenticated request.
            example: &a9
              user:
                id: 4a3a2e0e-2e8c-4b7a-9a6e-1f9d1e54b8f5
                email: ada@example.com
                name: Ada Lovelace
                emailVerified: true
                image: null
                createdAt: 2025-01-15T12:34:56.000Z
                updatedAt: 2025-04-02T08:00:00.000Z
              session:
                id: sess_01HXYZ…
                expiresAt: 2025-05-13T08:00:00.000Z
        session:
          type: object
          properties:
            id:
              type: string
              description: Opaque session identifier.
            expiresAt:
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
              description: ISO-8601 timestamp the session expires at.
          required:
            - id
            - expiresAt
          x-nestjs_zod-parent-has-refs: true
          x-nestjs_zod-self-required: true
          x-nestjs_zod-$defs: *a8
          x-nestjs_zod-parent-metadata:
            description: The session payload returned by `GET /api/auth/get-session` for an
              authenticated request.
            example: *a9
      required:
        - user
        - session
    SignUpWithEmailDto:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
          description: Email address to register.
          x-nestjs_zod-parent-metadata:
            description: Payload for `POST /api/auth/sign-up/email`.
            example: &a10
              email: ada@example.com
              password: correct-horse-battery-staple
              name: Ada Lovelace
        password:
          type: string
          minLength: 8
          description: New account password (8+ chars).
          x-nestjs_zod-parent-metadata:
            description: Payload for `POST /api/auth/sign-up/email`.
            example: *a10
        name:
          description: Optional display name.
          type: string
          minLength: 1
          x-nestjs_zod-parent-metadata:
            description: Payload for `POST /api/auth/sign-up/email`.
            example: *a10
      required:
        - email
        - password
    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          description: Unique identifier (UUID v4).
          x-nestjs_zod-has-null: true
          x-nestjs_zod-parent-metadata:
            description: A user account exposed to API clients.
            example: &a11
              id: 4a3a2e0e-2e8c-4b7a-9a6e-1f9d1e54b8f5
              email: ada@example.com
              name: Ada Lovelace
              emailVerified: true
              image: https://example.com/avatars/ada.png
              createdAt: 2025-01-15T12:34:56.000Z
              updatedAt: 2025-04-02T08:00:00.000Z
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
          description: The user’s primary email address.
          x-nestjs_zod-has-null: true
          x-nestjs_zod-parent-metadata:
            description: A user account exposed to API clients.
            example: *a11
        name:
          anyOf:
            - type: string
            - type: "null"
          description: Display name; null until the user sets one.
          x-nestjs_zod-has-null: true
          x-nestjs_zod-empty-type: true
          x-nestjs_zod-parent-metadata:
            description: A user account exposed to API clients.
            example: *a11
        emailVerified:
